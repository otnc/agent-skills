name: Sync

on:
  schedule:
    # 01:30 and 13:30 UTC = 10:30 and 22:30 JST, twice a day
    - cron: "30 1,13 * * *"
  repository_dispatch:
    types: [sync]
  workflow_dispatch:
    inputs:
      replay:
        description: "Rebuild the history from all past releases (first-time setup only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install docs toolchain (kiritan)
        run: npm ci
      - name: Sync skills and docs
        env:
          # SYNC_TOKEN (a PAT) is preferred: pushes with it count as repository
          # activity and can trigger repository_dispatch. GITHUB_TOKEN works too.
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          # Author identity for the sync commits (cmd/sync has no hardcoded
          # default; local runs fall back to the local git config instead).
          # The username-only noreply form attributes commits to the bot
          # account; there is no context that yields the bot identity.
          SYNC_GIT_NAME: github-actions[bot]
          SYNC_GIT_EMAIL: github-actions[bot]@users.noreply.github.com
        # cmd/sync vendors the skills, regenerates the skill list sections of
        # the base documents, rebuilds the generated docs with kiritan
        # (npm run build), commits everything, and --push pushes the commits
        # and tags to origin.
        run: |
          if [ "${{ inputs.replay }}" = "true" ]; then
            go run ./cmd/sync --push --replay
          else
            go run ./cmd/sync --push
          fi
