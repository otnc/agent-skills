name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 0.1.0)'
        required: true

# This Skill isn't an npm package — there's no package.json to bump and
# nothing gets published to a registry. "Releasing" just means tagging the
# reviewed commit and letting GitHub build the changelog from the commits
# and PRs merged since the previous tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Informational only, same as ci.yml: findings are suggestions, not
      # a hard gate, so this never fails the release on its own.
      - name: Self-lint prose for unnatural line breaks
        run: node scripts/lint.mjs SKILL.md README.md README.ja.md CHANGELOG.md references/*.md

      - name: Tag
        run: |
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
