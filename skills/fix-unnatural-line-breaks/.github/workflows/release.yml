name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 0.1.0)'
        required: true

# This Skill isn't an npm package — there's no package.json to bump and nothing gets published to a registry. "Releasing" just means tagging the reviewed commit and creating a GitHub Release whose notes are the commit subjects since the previous tag.

# We build notes from `git log` instead of `gh release create --generate-notes` because this repo is pushed to directly rather than through pull requests, and --generate-notes only has content to work with when there are merged PRs since the last tag — otherwise it produces a release body with nothing but a "Full Changelog" comparison link.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run lint.mjs test suite
        run: node --test scripts/*.test.mjs

      # Informational only, same as ci.yml: findings are suggestions, not a hard gate, so this never fails the release on its own.
      - name: Self-lint prose for unnatural line breaks
        run: node scripts/lint.mjs SKILL.md README.md README.ja.md CHANGELOG.md references/*.md scripts/*.mjs .github/workflows/*.yml

      # Computed before the new tag is created, so "the previous tag" can't accidentally resolve to the tag this run is about to make.
      - name: Build release notes from commits since the previous tag
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | head -n1 || true)"
          {
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s'
            else
              git log --no-merges --pretty=format:'- %s'
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Tag
        run: |
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file release-notes.md
